packages:
  - packages/*
  - packages/nuxt-board/playground
  - apps/*
  - docs
linkWorkspacePackages: true

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
overrides:
  '@hono/node-server': 1.19.15
  '@babel/core': 7.29.6
  brace-expansion: 5.0.12
  browserslist: 4.28.7
  esbuild: 0.28.1
  fast-uri: 3.1.7
  hono: 4.13.7
  ip-address: 10.7.3
  js-yaml: 4.3.2
  launch-editor: 2.14.2
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  tar: 7.5.22
  'undici@6': 6.28.1
  'undici@7': 7.29.1
  # GHSA-587h-7wmj-h5pm: vite bundles a vulnerable launch-editor; nuxt and unplugin resolve older patches.
  'vite@>=7.0.0 <7.3.7': 7.3.8
  'vite@>=8.2.0 <8.2.4': 8.2.4
  ws: 8.21.0
