name: docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-preview:
    if: ${{ github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Pull Vercel preview settings
        working-directory: apps/docs
        run: pnpm dlx vercel@56.2.0 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build docs preview
        working-directory: apps/docs
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.DOCS_PREVIEW_URL || 'https://vue-board.vercel.app' }}
        run: pnpm dlx vercel@56.2.0 build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy docs preview
        working-directory: apps/docs
        run: pnpm dlx vercel@56.2.0 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Pull Vercel production settings
        working-directory: apps/docs
        run: pnpm dlx vercel@56.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build docs production bundle
        working-directory: apps/docs
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://vue-board.vercel.app' }}
        run: pnpm dlx vercel@56.2.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy docs production bundle
        working-directory: apps/docs
        run: pnpm dlx vercel@56.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
