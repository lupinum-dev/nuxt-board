name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact fixed version from the five package manifests
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuxt-board
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish-required: ${{ steps.registry.outputs.publish-required }}

    steps:
      - name: Require main and a valid version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Require a safe release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          case "$status" in
            404) ;;
            200)
              tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.type')"
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
              while [ "$tag_type" = tag ]; do
                tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.type')"
                tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
              done
              test "$tag_type" = commit
              test "$tag_sha" = "$GITHUB_SHA"
              ;;
            *) echo "Could not verify tag availability (HTTP $status)" >&2; exit 1 ;;
          esac

      - name: Checkout the certified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up provenance verification Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install the locked Sigstore verifier
        env:
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: |
          mkdir -p "$SIGSTORE_PREFIX"
          cp scripts/sigstore-verifier/package.json \
            scripts/sigstore-verifier/package-lock.json \
            "$SIGSTORE_PREFIX/"
          npm ci --prefix "$SIGSTORE_PREFIX" --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuxt-board-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify the exact fixed-version package set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd .release
          sha256sum --check SHA256SUMS
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const path = require('node:path')
          const expected = [
            '@lupinum/board-connections',
            '@lupinum/board-core',
            '@lupinum/board-history',
            '@lupinum/nuxt-board',
            '@lupinum/vue-board',
          ]
          const manifest = JSON.parse(fs.readFileSync('release-artifact.json', 'utf8'))
          const actual = manifest.packages.map(entry => entry.name).sort()
          if (manifest.commit !== process.env.GITHUB_SHA) throw new Error('Artifact commit does not match main')
          if (manifest.version !== process.env.RELEASE_VERSION) throw new Error('Artifact version does not match the input')
          if (manifest.channel !== (manifest.version.includes('-') ? 'next' : 'latest')) throw new Error('Artifact channel is invalid')
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Artifact package set is not exact')
          if (manifest.changelog?.filename !== 'CHANGELOG.md') throw new Error('Certified changelog is missing')
          const expectedTarballs = manifest.packages.map(entry => entry.filename).sort()
          const actualTarballs = fs.readdirSync('.', { withFileTypes: true })
            .filter(entry => entry.isFile() && entry.name.endsWith('.tgz'))
            .map(entry => entry.name)
            .sort()
          if (JSON.stringify(actualTarballs) !== JSON.stringify(expectedTarballs)) {
            throw new Error('Release directory contains an unlisted or missing tarball')
          }
          const changelog = fs.readFileSync(manifest.changelog.filename)
          const changelogDigest = crypto.createHash('sha256').update(changelog).digest('hex')
          if (changelogDigest !== manifest.changelog.sha256) throw new Error('Changelog failed digest verification')
          if (!changelog.toString('utf8').includes(`## v${manifest.version}\n`)) throw new Error('Changelog has no section for this release')
          for (const entry of manifest.packages) {
            if (entry.version !== manifest.version) throw new Error(`${entry.name} is outside the fixed version`)
            if (!/^[a-z0-9._-]+\.tgz$/.test(entry.filename)) throw new Error(`Unsafe tarball name: ${entry.filename}`)
            const bytes = fs.readFileSync(path.join('.', entry.filename))
            if (crypto.createHash('sha1').update(bytes).digest('hex') !== entry.sha1) throw new Error(`${entry.name} failed SHA-1 verification`)
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error(`${entry.name} failed SHA-256 verification`)
          }
          NODE

      - name: Verify existing registry provenance
        id: registry
        env:
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: |
          node scripts/verify-registry-provenance.mjs .release --summary "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const record = JSON.parse(readFileSync('.release/registry-verification.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `publish-required=${record.packages.some(pkg => pkg.mode === 'absent')}\n`)
          NODE

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-board-release
          path: |
            .release/*.tgz
            .release/CHANGELOG.md
            .release/SHA256SUMS
            .release/release-artifact.json
            .release/registry-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish fixed package set to npm
    needs: verify
    if: needs.verify.outputs.publish-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-board-release
          path: .release

      - name: Publish or verify inert tarballs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const fail = message => { throw new Error(message) }
          const run = (args, options = {}) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: options.inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const hasAttestations = value => Array.isArray(value)
            ? value.length > 0
            : Boolean(value && typeof value === 'object' && Object.keys(value).length)
          const hashBytes = (bytes, algorithm) => createHash(algorithm).update(bytes).digest('hex')
          const hash = (path, algorithm) => hashBytes(readFileSync(path), algorithm)
          const slsaPredicateType = 'https://slsa.dev/provenance/v1'
          const verifyCurrentProvenance = async (attestations, spec, expectedHash) => {
            if (!hasAttestations(attestations) || typeof attestations.url !== 'string') {
              fail(`${spec} lost its verified npm provenance metadata.`)
            }
            const url = new URL(attestations.url)
            const prefix = '/-/npm/v1/attestations/'
            if (
              url.origin !== 'https://registry.npmjs.org' ||
              !url.pathname.startsWith(prefix) ||
              url.pathname.length === prefix.length ||
              url.username || url.password || url.search || url.hash
            ) fail(`${spec} returned an untrusted npm attestation URL.`)
            const response = await fetch(url, {
              headers: { Accept: 'application/json' },
              redirect: 'error',
            })
            if (!response.ok) {
              fail(`${spec} npm attestation lookup failed with HTTP ${response.status}.`)
            }
            const document = await response.json()
            const candidates = document?.attestations?.filter(
              attestation => attestation?.predicateType === slsaPredicateType && attestation.bundle,
            )
            if (!Array.isArray(candidates) || candidates.length !== 1) {
              fail(`${spec} must expose exactly one SLSA provenance bundle.`)
            }
            const currentHash = hashBytes(
              Buffer.from(JSON.stringify(candidates[0].bundle)),
              'sha256',
            )
            if (currentHash !== expectedHash) {
              fail(`${spec} provenance bundle changed after verification.`)
            }
          }
          const manifestBytes = readFileSync('.release/release-artifact.json')
          const manifest = JSON.parse(manifestBytes.toString('utf8'))
          const verification = JSON.parse(
            readFileSync('.release/registry-verification.json', 'utf8'),
          )
          const order = [
            '@lupinum/board-core',
            '@lupinum/vue-board',
            '@lupinum/board-history',
            '@lupinum/board-connections',
            '@lupinum/nuxt-board',
          ]
          const expectedWorkflow = {
            repository: 'https://github.com/lupinum-dev/nuxt-board',
            path: '.github/workflows/publish.yml',
            ref: 'refs/heads/main',
            identity: 'https://github.com/lupinum-dev/nuxt-board/.github/workflows/publish.yml@refs/heads/main',
            certificateIssuer: 'https://token.actions.githubusercontent.com',
            certificateOIDs: {
              '1.3.6.1.4.1.57264.1.3': manifest.commit,
              '1.3.6.1.4.1.57264.1.5': 'lupinum-dev/nuxt-board',
              '1.3.6.1.4.1.57264.1.6': 'refs/heads/main',
            },
          }
          const pollAttempts = Number(process.env.REGISTRY_POLL_ATTEMPTS ?? 240)
          const pollDelayMs = Number(process.env.REGISTRY_POLL_DELAY_MS ?? 5000)
          if (!Number.isSafeInteger(pollAttempts) || pollAttempts < 1) fail('Invalid registry poll attempt count.')
          if (pollAttempts > 240) fail('Invalid registry poll attempt limit.')
          if (!Number.isSafeInteger(pollDelayMs) || pollDelayMs < 0) fail('Invalid registry poll delay.')
          if (pollAttempts * pollDelayMs > 20 * 60 * 1000) fail('Invalid registry poll budget.')
          if (
            manifest.commit !== process.env.SOURCE_SHA ||
            manifest.version !== process.env.RELEASE_VERSION ||
            manifest.channel !== (manifest.version.includes('-') ? 'next' : 'latest')
          ) fail('Certified release coordinates differ.')
          if (
            verification.schemaVersion !== 1 ||
            verification.releaseArtifactSha256 !== hashBytes(manifestBytes, 'sha256') ||
            verification.sourceSha !== manifest.commit ||
            verification.version !== manifest.version ||
            verification.channel !== manifest.channel ||
            verification.sigstoreVersion !== '5.0.0' ||
            JSON.stringify(verification.workflow) !== JSON.stringify(expectedWorkflow)
          ) fail('Registry verification record differs from the certified artifact.')
          if (
            !Array.isArray(manifest.packages) || manifest.packages.length !== order.length ||
            !Array.isArray(verification.packages) || verification.packages.length !== order.length ||
            JSON.stringify(verification.packages.map(pkg => pkg.name)) !== JSON.stringify(order)
          ) fail('Registry verification package set differs.')
          const [major, minor] = run(['--version']).stdout.trim().split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 5)) fail('npm 11.5 or newer is required.')

          const plans = []
          for (const name of order) {
            const packages = manifest.packages.filter(candidate => candidate.name === name)
            const verifiedPackages = verification.packages.filter(candidate => candidate.name === name)
            if (packages.length !== 1 || verifiedPackages.length !== 1) {
              fail(`Missing or duplicate ${name}.`)
            }
            const pkg = packages[0]
            const verified = verifiedPackages[0]
            const tarball = join('.release', pkg.filename)
            if (
              !/^[A-Za-z0-9._-]+\.tgz$/.test(pkg.filename) ||
              pkg.version !== manifest.version ||
              verified.version !== pkg.version || verified.filename !== pkg.filename ||
              verified.sha1 !== pkg.sha1 || verified.sha256 !== pkg.sha256 ||
              hash(tarball, 'sha1') !== pkg.sha1 ||
              hash(tarball, 'sha256') !== pkg.sha256 ||
              hash(tarball, 'sha512') !== verified.sha512
            ) fail(`${name} failed exact artifact verification.`)
            if (!['absent', 'oidc'].includes(verified.mode)) {
              fail(`${name} has an invalid registry verification mode.`)
            }
            if (
              (verified.mode === 'absent' && verified.registryShasum !== null) ||
              (verified.mode !== 'absent' && verified.registryShasum !== pkg.sha1) ||
              (verified.mode === 'oidc' && !/^[0-9a-f]{64}$/.test(verified.provenanceBundleSha256)) ||
              (verified.mode !== 'oidc' && verified.provenanceBundleSha256 !== null)
            ) fail(`${name} has an invalid registry verification record.`)
            plans.push({ pkg, tarball, verified })
          }

          for (const { pkg, verified } of plans) {
            const spec = `${pkg.name}@${pkg.version}`
            const registryVersion = view(spec, 'version')
            const existing = registryVersion === null ? null : view(spec, 'dist.shasum')
            const channel = view(pkg.name, `dist-tags.${manifest.channel}`)
            if (verified.mode === 'absent') {
              if (registryVersion !== null) {
                fail(`${spec} was absent during verification but now exists; rerun verification.`)
              }
              if (channel !== verified.channelVersion) {
                fail(`${pkg.name} ${manifest.channel} tag changed after verification.`)
              }
              continue
            }
            if (registryVersion !== pkg.version || existing !== pkg.sha1) {
              fail(`${spec} changed after verification.`)
            }
            if (channel !== pkg.version || channel !== verified.channelVersion) {
              fail(`${pkg.name} ${manifest.channel} tag changed after verification.`)
            }
            const attestations = view(spec, 'dist.attestations')
            if (verified.mode === 'oidc') {
              await verifyCurrentProvenance(
                attestations,
                spec,
                verified.provenanceBundleSha256,
              )
            }
          }

          for (const { pkg, tarball, verified } of plans) {
            if (verified.mode === 'absent') {
              const result = run([
                'publish', tarball, '--access', 'public',
                '--tag', manifest.channel, '--ignore-scripts', '--provenance',
              ], { inherit: true })
              if (result.status !== 0) fail(`npm publish failed for ${pkg.name}.`)
            }
          }

          const verifiedPackages = new Set()
          for (let attempt = 0; attempt < pollAttempts; attempt += 1) {
            for (const pkg of plans.map(plan => plan.pkg)) {
              if (verifiedPackages.has(pkg.name)) continue
              const spec = `${pkg.name}@${pkg.version}`
              const shasum = view(spec, 'dist.shasum')
              const attestations = view(spec, 'dist.attestations')
              const channel = view(pkg.name, `dist-tags.${manifest.channel}`)
              if (
                shasum === pkg.sha1 &&
                channel === pkg.version &&
                hasAttestations(attestations)
              ) {
                verifiedPackages.add(pkg.name)
              }
            }
            if (verifiedPackages.size === plans.length) break
            if (attempt + 1 < pollAttempts) {
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, pollDelayMs)
            }
          }
          for (const { pkg } of plans) {
            if (!verifiedPackages.has(pkg.name)) {
              fail(`${pkg.name}@${pkg.version} did not expose the required bytes, provenance mode, and ${manifest.channel}.`)
            }
          }
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            '\nAll fixed-set packages expose certified bytes and OIDC provenance.\n',
          )
          NODE

  github-release:
    name: Create GitHub release
    needs:
      - verify
      - publish
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-board-release
          path: .release

      - name: Create the release from the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          const expectedPackages = [
            '@lupinum/board-core',
            '@lupinum/vue-board',
            '@lupinum/board-history',
            '@lupinum/board-connections',
            '@lupinum/nuxt-board',
          ]
          const manifest = JSON.parse(fs.readFileSync('.release/release-artifact.json', 'utf8'))
          if (manifest.packages?.length !== expectedPackages.length) {
            throw new Error('Release manifest package set differs')
          }
          const packageAssets = expectedPackages.map(name => {
            const matches = manifest.packages?.filter(pkg => pkg.name === name) ?? []
            if (matches.length !== 1) throw new Error(`Missing or duplicate ${name}`)
            const filename = matches[0].filename
            if (!/^[A-Za-z0-9._-]+\.tgz$/.test(filename)) throw new Error(`Unsafe tarball name: ${filename}`)
            return `.release/${filename}`
          })
          if (new Set(packageAssets).size !== expectedPackages.length) {
            throw new Error('Release manifest contains duplicate tarball filenames')
          }
          fs.writeFileSync('.release/PACKAGE_ASSETS', `${packageAssets.join('\n')}\n`)
          const changelog = fs.readFileSync('.release/CHANGELOG.md', 'utf8').replaceAll('\r\n', '\n')
          const marker = `## v${version}`
          const start = changelog.startsWith(marker) ? 0 : changelog.indexOf(`\n${marker}`) + 1
          if (start < 1 && !changelog.startsWith(marker)) throw new Error(`Missing changelog section for v${version}`)
          const end = changelog.indexOf('\n## ', start + marker.length)
          const notes = changelog.slice(start, end === -1 ? undefined : end).trim()
          fs.writeFileSync('.release/RELEASE_NOTES.md', `${notes}\n`)
          NODE
          package_assets=()
          while IFS= read -r asset; do
            package_assets+=("$asset")
          done < .release/PACKAGE_ASSETS
          test "${#package_assets[@]}" -eq 5
          release_assets=(
            "${package_assets[@]}"
            .release/CHANGELOG.md
            .release/SHA256SUMS
            .release/release-artifact.json
            .release/registry-verification.json
          )
          RELEASE_TAG="v$RELEASE_VERSION"
          prerelease=false
          case "$RELEASE_VERSION" in *-*) prerelease=true ;; esac
          release_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) release_exists=false ;;
            200) release_exists=true ;;
            *) echo "Could not verify GitHub release state (HTTP $release_status)" >&2; exit 1 ;;
          esac
          tag_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          case "$tag_status" in
            404)
              if [ "$release_exists" = true ]; then
                echo "The existing GitHub release has no tag." >&2
                exit 1
              fi
              if ! tag_error="$(gh api --silent --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" 2>&1)"; then
                if grep -Eq 'HTTP 403|Resource not accessible by integration' <<< "$tag_error"; then
                  echo "::error::HUMAN-ONLY: GitHub cannot create this historical tag with GITHUB_TOKEN."
                  echo "HUMAN-ONLY: gh api --method POST \"repos/$GITHUB_REPOSITORY/git/refs\" -f ref=\"refs/tags/$RELEASE_TAG\" -f sha=\"$SOURCE_SHA\""
                else
                  printf '%s\n' "$tag_error" >&2
                fi
                exit 1
              fi
              ;;
            200) ;;
            *) echo "Could not verify tag state (HTTP $tag_status)" >&2; exit 1 ;;
          esac
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          while [ "$tag_type" = tag ]; do
            tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.type')"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          done
          test "$tag_type" = commit
          test "$tag_sha" = "$SOURCE_SHA"
          if [ "$release_exists" = true ]; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file .release/RELEASE_NOTES.md \
              --prerelease="$prerelease"
          else
            create_flags=()
            if [ "$prerelease" = true ]; then create_flags=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file .release/RELEASE_NOTES.md \
              "${create_flags[@]}"
          fi
