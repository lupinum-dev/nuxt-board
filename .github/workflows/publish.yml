name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact fixed version from the five package manifests
        required: true
        type: string
      allow_bootstrap:
        description: Authorize exact first-version recovery without npm provenance
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-nuxt-board
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require main and a valid version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Require a safe release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          case "$status" in
            404) ;;
            200)
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
              test "$tag_sha" = "$GITHUB_SHA"
              gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
              ;;
            *) echo "Could not verify tag availability (HTTP $status)" >&2; exit 1 ;;
          esac

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuxt-board-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify the exact fixed-version package set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd .release
          sha256sum --check SHA256SUMS
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const path = require('node:path')
          const expected = [
            '@lupinum/board-connections',
            '@lupinum/board-core',
            '@lupinum/board-history',
            '@lupinum/nuxt-board',
            '@lupinum/vue-board',
          ]
          const manifest = JSON.parse(fs.readFileSync('release-artifact.json', 'utf8'))
          const actual = manifest.packages.map(entry => entry.name).sort()
          if (manifest.commit !== process.env.GITHUB_SHA) throw new Error('Artifact commit does not match main')
          if (manifest.version !== process.env.RELEASE_VERSION) throw new Error('Artifact version does not match the input')
          if (manifest.channel !== (manifest.version.includes('-') ? 'next' : 'latest')) throw new Error('Artifact channel is invalid')
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Artifact package set is not exact')
          if (manifest.changelog?.filename !== 'CHANGELOG.md') throw new Error('Certified changelog is missing')
          const changelog = fs.readFileSync(manifest.changelog.filename)
          const changelogDigest = crypto.createHash('sha256').update(changelog).digest('hex')
          if (changelogDigest !== manifest.changelog.sha256) throw new Error('Changelog failed digest verification')
          if (!changelog.toString('utf8').includes(`## v${manifest.version}\n`)) throw new Error('Changelog has no section for this release')
          for (const entry of manifest.packages) {
            if (entry.version !== manifest.version) throw new Error(`${entry.name} is outside the fixed version`)
            if (!/^[a-z0-9._-]+\.tgz$/.test(entry.filename)) throw new Error(`Unsafe tarball name: ${entry.filename}`)
            const bytes = fs.readFileSync(path.join('.', entry.filename))
            if (crypto.createHash('sha1').update(bytes).digest('hex') !== entry.sha1) throw new Error(`${entry.name} failed SHA-1 verification`)
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error(`${entry.name} failed SHA-256 verification`)
          }
          NODE

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-board-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish fixed package set to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      bootstrap: ${{ steps.publish.outputs.bootstrap }}
      bootstrap-packages: ${{ steps.publish.outputs.bootstrap-packages }}
      modes: ${{ steps.publish.outputs.modes }}

    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-board-release
          path: .release

      - name: Publish or verify inert tarballs
        id: publish
        env:
          ALLOW_BOOTSTRAP: ${{ inputs.allow_bootstrap }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const [major, minor] = run(['--version']).stdout.trim().split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 5)) throw new Error('npm 11.5 or newer is required')
          const manifest = JSON.parse(fs.readFileSync('.release/release-artifact.json', 'utf8'))
          const order = [
            '@lupinum/board-core',
            '@lupinum/vue-board',
            '@lupinum/board-history',
            '@lupinum/board-connections',
            '@lupinum/nuxt-board',
          ]
          const modes = new Map()
          const pollAttempts = Number(process.env.REGISTRY_POLL_ATTEMPTS ?? 240)
          const pollDelayMs = Number(process.env.REGISTRY_POLL_DELAY_MS ?? 5000)
          if (!Number.isSafeInteger(pollAttempts) || pollAttempts < 1) fail('Invalid registry poll attempt count.')
          if (!Number.isSafeInteger(pollDelayMs) || pollDelayMs < 0) fail('Invalid registry poll delay.')
          if (manifest.version !== process.env.RELEASE_VERSION) fail('Release version differs.')
          for (const name of order) {
            const entry = manifest.packages.find(candidate => candidate.name === name)
            if (!entry) throw new Error(`Missing verified package: ${name}`)
            const spec = `${name}@${entry.version}`
            const existing = view(spec, 'dist.shasum')
            if (existing && existing !== entry.sha1) fail(`${spec} exists with different bytes.`)
            if (existing) {
              const attestations = view(spec, 'dist.attestations')
              const published = view(name, 'versions')
              const versions = Array.isArray(published) ? published : [published]
              if (!attestations && (versions.length !== 1 || versions[0] !== entry.version)) {
                fail(`${spec} is not the first package version and has no provenance.`)
              }
              if (!attestations && process.env.ALLOW_BOOTSTRAP !== 'true') {
                fail(`${spec} requires explicit bootstrap authorization.`)
              }
              modes.set(name, attestations ? 'oidc' : 'bootstrap')
            } else {
              const result = run([
                'publish', path.join('.release', entry.filename), '--access', 'public',
                '--tag', manifest.channel, '--ignore-scripts', '--provenance',
              ], true)
              if (result.status !== 0) fail(`npm publish failed for ${name}.`)
              modes.set(name, 'oidc')
            }
          }
          const verifiedPackages = new Set()
          for (let attempt = 0; attempt < pollAttempts; attempt += 1) {
            for (const entry of manifest.packages) {
              if (verifiedPackages.has(entry.name)) continue
              const spec = `${entry.name}@${entry.version}`
              const shasum = view(spec, 'dist.shasum')
              const attestations = view(spec, 'dist.attestations')
              const channel = view(entry.name, `dist-tags.${manifest.channel}`)
              const mode = modes.get(entry.name)
              const published = mode === 'bootstrap' ? view(entry.name, 'versions') : null
              const versions = Array.isArray(published) ? published : [published]
              const remainsFirstVersion = mode !== 'bootstrap' || (
                versions.length === 1 && versions[0] === entry.version
              )
              if (
                shasum === entry.sha1 &&
                channel === entry.version &&
                remainsFirstVersion &&
                (mode === 'bootstrap' || (mode === 'oidc' && attestations))
              ) {
                verifiedPackages.add(entry.name)
              }
            }
            if (verifiedPackages.size === manifest.packages.length) break
            if (attempt + 1 < pollAttempts) {
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, pollDelayMs)
            }
          }
          for (const entry of manifest.packages) {
            if (!verifiedPackages.has(entry.name)) {
              fail(`${entry.name}@${entry.version} did not expose the required bytes, provenance mode, and ${manifest.channel}.`)
            }
          }
          const publicationModes = Object.fromEntries(modes)
          const bootstrapPackages = [...modes]
            .filter(([, mode]) => mode === 'bootstrap')
            .map(([name]) => name)
          const bootstrap = bootstrapPackages.length > 0
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bootstrap=${String(bootstrap)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bootstrap-packages=${bootstrapPackages.join(',')}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `modes=${JSON.stringify(publicationModes)}\n`)
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `\nPublication modes: ${JSON.stringify(publicationModes)}.\n`,
          )
          NODE

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-board-release
          path: .release

      - name: Create the release from the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          BOOTSTRAP_RELEASE: ${{ needs.publish.outputs.bootstrap }}
          BOOTSTRAP_PACKAGES: ${{ needs.publish.outputs.bootstrap-packages }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          const changelog = fs.readFileSync('.release/CHANGELOG.md', 'utf8').replaceAll('\r\n', '\n')
          const marker = `## v${version}`
          const start = changelog.startsWith(marker) ? 0 : changelog.indexOf(`\n${marker}`) + 1
          if (start < 1 && !changelog.startsWith(marker)) throw new Error(`Missing changelog section for v${version}`)
          const end = changelog.indexOf('\n## ', start + marker.length)
          const notes = changelog.slice(start, end === -1 ? undefined : end).trim()
          fs.writeFileSync('.release/RELEASE_NOTES.md', `${notes}\n`)
          NODE
          if [ "$BOOTSTRAP_RELEASE" = true ]; then
            cat >> .release/RELEASE_NOTES.md <<'NOTICE'

          > [!NOTE]
          > This first npm version was created from the exact CI-certified artifact before npm trusted publishing could be configured. npm does not provide GitHub OIDC provenance for this bootstrap publication. The protected workflow verified the registry bytes. Later versions use trusted publishing with provenance.
          NOTICE
            printf '> Bootstrap packages: %s\n' "$BOOTSTRAP_PACKAGES" >> .release/RELEASE_NOTES.md
          fi
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "v$RELEASE_VERSION" .release/*.tgz .release/CHANGELOG.md .release/SHA256SUMS .release/release-artifact.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --title "v$RELEASE_VERSION" --notes-file .release/RELEASE_NOTES.md
          else
            prerelease=()
            case "$RELEASE_VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "v$RELEASE_VERSION" .release/*.tgz .release/CHANGELOG.md .release/SHA256SUMS .release/release-artifact.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$RELEASE_VERSION" \
              --notes-file .release/RELEASE_NOTES.md \
              "${prerelease[@]}"
          fi
