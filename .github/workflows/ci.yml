name: ci

on:
  pull_request:
  push:
    branches: [main]
  # In libraries, release.yml starts this workflow on the Version packages PR,
  # because pull requests opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `verify` script in package.json.
        task: [lint, typecheck, test, build, audit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # lint compares the pull request with origin/main.
          fetch-depth: ${{ matrix.task == 'lint' && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - if: matrix.task != 'audit'
        run: pnpm install --frozen-lockfile
      # build also installs the packed tarballs into Vue and Nuxt 3.19/4.0 consumers (D2).
      - if: matrix.task == 'build'
        run: pnpm build && pnpm test:packed
      - if: matrix.task != 'audit' && matrix.task != 'build'
        run: pnpm ${{ matrix.task }}
      # Only production advisories that reach a published package block releases.
      - if: matrix.task == 'audit'
        run: node scripts/audit-deps.mjs

  # The packages support Node 20.19 (D2).
  node-20:
    name: test (Node 20.19)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Standalone pnpm brings its own Node, so pnpm 11 runs while the tests use Node 20.19.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Screenshot baselines are rendered on macOS (D2).
  e2e:
    name: e2e (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  # The one required status check for the main branch ruleset.
  ci:
    name: ci
    if: always()
    needs: [check, node-20, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
