name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.paths.outputs.full }}
    steps:
      - name: Select required lanes
        id: paths
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runAll = context.eventName !== 'pull_request'
            const files = runAll
              ? []
              : await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                })
            const paths = files.map((file) => file.filename)
            const publicDocsOnly =
              paths.length > 0 &&
              paths.every((path) =>
                /^(?:docs\/content\/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|MAINTAINING\.md$|AGENTS\.md$|CLAUDE\.md$|LICENSE$)/u.test(path),
              )
            core.setOutput('full', String(runAll || !publicDocsOnly))

  checks:
    name: checks (Node ${{ matrix.node }})
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            command: verify:library
          - node: 22
            command: release:verify

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: matrix.command == 'release:verify'
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm ${{ matrix.command }}

      - name: Retain the certified release set
        if: github.event_name == 'push' && matrix.command == 'release:verify'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuxt-board-release
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  visual-regression:
    name: visual regression (macOS)
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Playwright interactions and screenshots
        run: pnpm test:e2e

  gate:
    name: CI gate
    if: always()
    needs:
      - classify
      - checks
      - visual-regression
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL: ${{ needs.classify.outputs.full }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$FULL" = true ]; then
            test "$CHECKS_RESULT" = success
            test "$VISUAL_RESULT" = success
          else
            test "$CHECKS_RESULT" = skipped
            test "$VISUAL_RESULT" = skipped
          fi
