name: Package preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build disposable certified tarballs
        id: artifact
        run: pnpm package-preview:build

      - name: Publish commit-addressed previews
        id: publish
        shell: bash
        env:
          PREVIEW_MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: |
          mapfile -t TARBALLS < <(node -e "const m=require('./' + process.env.PREVIEW_MANIFEST); for (const p of m.packages) console.log(p.tarball)")
          pnpm exec pkg-pr-new publish \
            --no-compact \
            --comment=update \
            --commentWithSha \
            --no-template \
            --packageManager=pnpm,npm \
            "${TARBALLS[@]}"

      - name: Verify hosted preview URLs and bytes
        env:
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-package-preview.mjs "${{ steps.artifact.outputs.manifest }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-preview-${{ github.run_id }}
          path: ${{ steps.artifact.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
